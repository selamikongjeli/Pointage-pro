services:
  - type: web
    name: pointage-pro
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: POINTAGE_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pointage-pro-db
          property: connectionString
databases:
  - name: pointage-pro-db
    plan: free
