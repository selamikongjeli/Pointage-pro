<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.json"><title>Pointage Pro QR v3</title><style>
body{font-family:Arial;margin:0;background:#f4f6f8;color:#172033}header{background:#111827;color:white;padding:16px;font-size:22px;font-weight:800}.w{max-width:900px;margin:auto;padding:15px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:15px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{border:0;border-radius:10px;padding:12px;background:#2563eb;color:white;font-weight:700}.g{background:#15803d}.o{background:#d97706}.r{background:#b91c1c}.x{background:#e5e7eb;color:#111}.hide{display:none}input,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccc;border-radius:8px}.qr{text-align:center}.qr img{max-width:300px;width:90%}.item{padding:9px 0;border-bottom:1px solid #eee}.ok{background:#dcfce7;padding:12px;border-radius:10px}.err{background:#fee2e2;padding:12px;border-radius:10px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:13px}</style></head>
<body><header>⏱ POINTAGE PRO QR v3</header><div class="w"><div class="grid"><button onclick="mode('e')">👤 Employé</button><button class="x" onclick="mode('a')">🔐 Patron</button></div><br>
<section id="e"><div class="card"><h2>Connexion employé</h2><input id="ecode" placeholder="Code employé"><input id="epin" type="password" placeholder="PIN"><button onclick="elogin()">Connexion</button></div><div id="ea" class="hide"><div class="card"><h3 id="ename"></h3><div class="grid"><button class="g" onclick="choose('in')">▶ Entrée</button><button class="o" onclick="choose('pause_start')">☕ Début pause</button><button class="o" onclick="choose('pause_end')">↩ Fin pause</button><button class="r" onclick="choose('out')">■ Sortie</button></div><p id="chosen"></p><button id="scan" class="hide" onclick="startScan()">📷 Scanner le QR</button></div><div id="scanbox" class="card hide"><div id="reader"></div></div><div id="result"></div></div></section>
<section id="a" class="hide"><div id="setup" class="card hide"><h2>Première configuration</h2><input id="company" placeholder="Nom entreprise"><input id="setupPin" type="password" placeholder="PIN patron"><button onclick="setupAdmin()">Créer</button></div><div id="alogin" class="card"><h2>Accès patron</h2><input id="apin" type="password" placeholder="PIN patron"><button onclick="adminEnter()">Connexion</button></div><div id="aa" class="hide"><div class="card qr"><h2>QR dynamique</h2><img id="qrimg"><p>Expire dans <b id="count">--</b> s</p><button onclick="refreshQR()">Nouveau QR</button></div><div class="card"><h3>Ajouter employé</h3><input id="sname" placeholder="Nom"><input id="scode" placeholder="Code ex. 001"><input id="spin" type="password" placeholder="PIN"><select id="srole"><option>Employé</option><option>Serveur</option><option>Cuisine</option><option>Responsable</option></select><button onclick="addStaff()">Ajouter</button></div><div class="card"><h3>Employés</h3><div id="staff"></div></div><div class="card"><h3>Rapport mensuel</h3><input id="month" type="month"><button onclick="report()">Afficher</button> <button class="x" onclick="csv()">Exporter CSV</button><div id="rep"></div></div><div class="card"><h3>Historique</h3><button class="x" onclick="history()">Actualiser</button><div id="hist"></div></div></div></section></div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script>
let admin='',sp='',act='',sc=null,t=null;function mode(x){e.classList.toggle('hide',x!=='e');a.classList.toggle('hide',x!=='a')}async function api(u,o={}){let r=await fetch(u,o),j=await r.json().catch(()=>({}));if(!r.ok)throw j;return j}
async function init(){month.value=new Date().toISOString().slice(0,7);let s=await api('/api/status');if(!s.adminSetup){setup.classList.remove('hide');alogin.classList.add('hide')}}async function setupAdmin(){await api('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({company:company.value,pin:setupPin.value})});location.reload()}
async function adminEnter(){try{await api('/api/staff',{headers:{'x-admin-pin':apin.value}});admin=apin.value;alogin.classList.add('hide');aa.classList.remove('hide');refreshQR();loadStaff();history();report()}catch{alert('PIN patron incorrect')}}async function refreshQR(){
  try {
    let j = await api('/api/qr', {
      headers: {'x-admin-pin': admin}
    });

    console.log('Réponse QR:', j);

    if (!j || !j.token) {
      alert('Erreur : aucun QR reçu du serveur');
      return;
    }

    QRCode.toDataURL(
      j.token,
      {width:320, margin:1},
      (err, u) => {
        if (err) {
          console.error(err);
          alert('Erreur création QR');
          return;
        }
        qrimg.src = u;
      }
    );

    let n = j.expiresIn || 60;

    clearInterval(t);
    count.textContent = n;

    t = setInterval(() => {
      count.textContent = --n;
      if (n <= 0) refreshQR();
    }, 1000);

  } catch(e) {
    console.error('Erreur QR:', e);
    alert('Erreur QR : ' + e.message);
  }
}
async function addStaff(){try{await api('/api/staff',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pin':admin},body:JSON.stringify({name:sname.value,code:scode.value,pin:spin.value,role:srole.value})});sname.value=scode.value=spin.value='';loadStaff()}catch(x){alert(x.error==='CODE_EXISTS'?'Code déjà utilisé':'Erreur')}}async function loadStaff(){let x=await api('/api/staff',{headers:{'x-admin-pin':admin}});staff.innerHTML=x.map(v=>`<div class="item"><b>${v.name}</b> — ${v.role}<br>Code ${v.code}</div>`).join('')}
async function history(){let x=await api('/api/history',{headers:{'x-admin-pin':admin}}),L={in:'Entrée',pause_start:'Début pause',pause_end:'Fin pause',out:'Sortie'};hist.innerHTML=x.slice(0,100).map(v=>`<div class="item"><b>${v.staff_name}</b> — ${L[v.type]}<br>${new Date(v.time).toLocaleString('fr-BE')}</div>`).join('')}async function report(){let j=await api('/api/report?month='+month.value,{headers:{'x-admin-pin':admin}});rep.innerHTML='<table><tr><th>Employé</th><th>Heures</th><th>Pointages</th></tr>'+j.employees.map(v=>`<tr><td>${v.name}</td><td>${v.hours.toFixed(2)} h</td><td>${v.events}</td></tr>`).join('')+'</table>'}
async function csv(){let r=await fetch('/api/export.csv?month='+month.value,{headers:{'x-admin-pin':admin}}),b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pointage-'+month.value+'.csv';a.click()}async function elogin(){try{let j=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:ecode.value,pin:epin.value})});sp=epin.value;ename.textContent='Bonjour '+j.staff.name;ea.classList.remove('hide')}catch{alert('Code ou PIN incorrect')}}function choose(x){act=x;let L={in:'Entrée',pause_start:'Début pause',pause_end:'Fin pause',out:'Sortie'};chosen.textContent='Action : '+L[x];scan.classList.remove('hide')}
function startScan(){scanbox.classList.remove('hide');if(sc)return;sc=new Html5Qrcode('reader');sc.start({facingMode:'environment'},{fps:10,qrbox:240},submit).catch(()=>result.innerHTML='<div class="err">Caméra indisponible : vérifie HTTPS et autorisation caméra.</div>')}async function submit(tok){try{let j=await api('/api/punch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:ecode.value,pin:sp,token:tok,action:act})});result.innerHTML='<div class="ok"><b>Pointage enregistré</b><br>'+new Date(j.time).toLocaleString('fr-BE')+'</div>';stop()}catch(x){result.innerHTML='<div class="err">'+(x.error==='QR_EXPIRED'?'QR expiré':x.error==='INVALID_SEQUENCE'?'Action impossible dans cet ordre':'Pointage refusé')+'</div>';stop()}}function stop(){if(sc)sc.stop().catch(()=>{}).finally(()=>{sc.clear();sc=null;scanbox.classList.add('hide')})}init();
</script></body></html>
